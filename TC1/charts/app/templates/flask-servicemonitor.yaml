{{- range $key, $app := .Values.config }}
{{- if $app.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $app.name }}-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: {{ $app.name }}
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: "metrics"
      path: /metrics
      interval: 15s
{{- end }}
{{- end }}
