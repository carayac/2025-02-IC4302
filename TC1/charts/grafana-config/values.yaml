prometheus: 
  namespace: monitoring
dashboards:
  elasticsearch:
    name: elasticsearch
    file: elasticsearch.json
    enable: true
  elasticsearchbd:
    name: elasticsearchbd
    file: elasticsearchbd.json
    enable: true
  redis:
    name: redis
    file: redis.json
    enable: true
  mariadb:
    name: mariadb
    file: mariadb.json
    enable: true
  mariadbbd:
    name: mariadbbd
    file: mariadbbd.json
    enable: true
  mongodb:
    name: mongodb
    file: mongodb.json
    enable: false
  memcached:
    name: memcached
    file: memcached.json
    enable: true
  postgresql:
    name: postgresql
    file: postgresql.json
    enable: true
  postgresqlbd:
    name: postgresqlbd
    file: postgresqlbd.json
    enable: true
  chroma:
    name: chroma
    file: chroma.json
    enable: true
  vespa:
    name: vespa
    file: vespa.json
    enable: true
