apiVersion: v1
kind: ConfigMap
metadata:
  name: vespa-app
  namespace: default
data:
  services.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <services version="1.0">
      <admin version="2.0">
        <adminserver hostalias="vespa-0"/>
      </admin>

      <container id="container" version="1.0">
        <search/>
        <document-api/>
        <http>
          <server id="default" port="8081"/>
        </http>
      </container>

      <content id="content" version="1.0">
        <redundancy>1</redundancy>
        <documents>
          <document type="animales" mode="index"/>
        </documents>
        <nodes>
          <node distribution-key="0" hostalias="vespa-0"/>
        </nodes>
      </content>
    </services>
  hosts.xml: |-
    <hosts>
      <host name="vespa-0.vespa.default.svc.cluster.local">
        <alias>vespa-0</alias>
      </host>
    </hosts>
  animales.sd: |-
    schema animales {
      document animales {
        field id type string { indexing: summary | attribute }
        field title type string { indexing: index | summary }
      }
      fieldset default { fields: title }
    }
