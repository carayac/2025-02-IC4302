# monitoring-stack/values.yaml

grafana:
  namespaceOverride: monitoring
  operator:
    enabled: true
    scanAllNamespaces: true
    prometheus:
      serviceMonitor:
        enabled: true
  grafana:
    enabled: true
    dashboardLabelSelectors:
      - matchLabels:
          app: grafana
    persistence:
      enabled: true
      size: 5Gi

prometheus:
  namespaceOverride: monitoring
  prometheus:
    retention: 2d
    persistence:
      enabled: true
      size: 5Gi
  alertmanager:
    persistence:
      enabled: true
      size: 5Gi

prometheus-elasticsearch-exporter:
  enabled: true
  namespaceOverride: monitoring
  es:
    uri: http://ic4302-es-http.default.svc.cluster.local:9200
    basicAuth:
      username: elastic  
  existingSecret: ic4302-es-elastic-user
  existingSecretPasswordKey: elastic  
  extraArgs:
    - --es.all
  serviceMonitor:
    enabled: true
    namespace: monitoring
    additionalLabels:
      release: prometheus