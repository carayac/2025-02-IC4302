apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.config.producer.name }}
spec:
  schedule: {{ .Values.config.cronjob.schedule }}   
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: {{ .Values.config.producer.name }}
              image: {{ .Values.config.docker_registry }}/{{ .Values.config.producer.image }}
              env:
                - name: DATAFROMK8S
                  value: "Hey"
                - name: RABBITMQ
                  value: "databases-rabbitmq"
                - name: RABBITMQ_QUEUE
                  value: "queue"
                - name: RABBITMQ_USER
                  value: "user"
                - name: RABBITMQ_PASS
                  valueFrom:
                    secretKeyRef:
                      name: databases-rabbitmq
                      key: rabbitmq-password
                      optional: false
                - name: MARIADB
                  value: "databases-mariadb"
                - name: MARIADB_TABLE
                  value: "objects"
                - name: MARIADB_DB
                  value: "control"
                - name: MARIADB_USER
                  value: "root"
                - name: MARIADB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: databases-mariadb
                      key: mariadb-root-password
                      optional: false


