elastic:
  enabled: true
  version: 8.6.1
  replicas: 1
  name: ic4302
kibana:
  enabled: true
  version: 8.6.1
  replicas: 1
  name: ic4302

mariadb:
  replicas: 3
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    tag: 11.2.3-debian-11-r1
  auth:
    database: "promptsy"
  initdbScriptsConfigMap: "configmap-initdb"
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      namespace: "monitoring"

