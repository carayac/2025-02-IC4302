{{- if .Values.config.consumerCSV.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.consumerCSV.name }}
  labels:
    app: {{ .Values.config.consumerCSV.name }}
spec:
  replicas: {{ .Values.config.consumerCSV.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.consumerCSV.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.consumerCSV.name }}
    spec:
      containers:
        - name: {{ .Values.config.consumerCSV.name }}
          image: {{ .Values.config.docker_registry }}/{{ .Values.config.consumerCSV.image }}
          env:
            - name: DATAFROMK8S
              value: "Hey"
            - name: RABBITMQ
              value: "databases-rabbitmq"
            - name: RABBITMQ_QUEUE
              value: "queue_csv"
            - name: RABBITMQ_USER
              value: "user"
            - name: XPATH
              value: "/data"
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: databases-rabbitmq
                  key: rabbitmq-password
                  optional: false
            - name: MARIADB
              value: "databases-mariadb"
            - name: MARIADB_TABLE
              value: "objects"
            - name: MARIADB_TABLE_BOOKS
              value: "books"
            - name: MARIADB_TABLE_AUTHORS
              value: "authors"
            - name: MARIADB_TABLE_CATEGORIES
              value: "categories"
            - name: MARIADB_TABLE_AUTHORS_BOOKS
              value: "book_authors"
            - name: MARIADB_TABLE_CATEGORIES_BOOKS
              value: "book_categories"
            - name: MARIADB_DB
              value: "promptsy"
            - name: MARIADB_USER
              value: "root"
            - name: MARIADB_PASS
              valueFrom:
                secretKeyRef:
                  name: databases-mariadb
                  key: mariadb-root-password
                  optional: false
            - name: ELASTIC_USER
              value: "elastic"
            - name: ELASTIC_PASS
              valueFrom:
                secretKeyRef:
                  name: ic4302-es-elastic-user
                  key: elastic
                  optional: false
            - name: ELASTIC_HOST
              value: "ic4302-es-http"
            - name: ELASTIC_INDEX_BOOKS
              value: "books"
            - name: ELASTIC_INDEX_NBOOKS
              value: "nbooks"
            - name: AWS_BUCKET
              value: "ic-tec-dataset"
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret    
                  key: AWS_ACCESS_KEY
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_KEY
            - name: AWS_REGION
              value: "us-east-1"
            - name: EMBEDDINGENDPOINT
              value: "http://huggingface:5000/encode"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          emptyDir: {}
{{- end }}          
