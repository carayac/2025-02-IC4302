{{- if .Values.config.huggingface.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.huggingface.name }}
  labels:
    app: {{ .Values.config.huggingface.name }}
spec:
  replicas: {{ .Values.config.huggingface.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.huggingface.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.huggingface.name }}
    spec:
      containers:
        - name: {{ .Values.config.huggingface.name }}
          image: "{{ .Values.config.docker_registry }}/{{ .Values.config.huggingface.image }}"
          command: ["flask"]
          args: ["--app", "app", "run", "--host=0.0.0.0", "--port=5000"]
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.huggingface.name }}
  labels:
    app: {{ .Values.config.huggingface.name }}
    service: {{ .Values.config.huggingface.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.config.huggingface.name }}
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 32000
{{- end }}