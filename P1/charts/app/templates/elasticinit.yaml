apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.config.elasticinit.name }}
spec:
  template:
    spec:
      containers:
        - name: {{ .Values.config.elasticinit.name }}
          image: {{ .Values.config.docker_registry }}/{{ .Values.config.elasticinit.image }}
          env:
            - name: ELASTIC_USER
              value: "elastic"
            - name: ELASTIC_PASS
              valueFrom:
                secretKeyRef:
                  name: ic4302-es-elastic-user
                  key: elastic
                  optional: false
            - name: ELASTIC_HOST
              value: "ic4302-es-http"
            - name: ELASTIC_INDEX_REVIEWS
              value: "reviews"
            - name: ELASTIC_INDEX_NREVIEWS
              value: "nreviews"
      restartPolicy: OnFailure