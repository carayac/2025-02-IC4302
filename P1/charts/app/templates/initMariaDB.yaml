{{- if .Values.config.initMariaDB.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.config.initMariaDB.name }}
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: {{ .Values.config.initMariaDB.name }}
          image: {{ .Values.config.docker_registry }}/{{ .Values.config.initMariaDB.image }}
          env:
            - name: MARIADB
              value: "databases-mariadb"
            - name: MARIADB_DB
              value: "control"
            - name: MARIADB_USER
              value: "root"
            - name: MARIADB_PASS
              valueFrom:
                secretKeyRef:
                  name: databases-mariadb
                  key: mariadb-root-password
            - name: MARIADB_TABLE
              value: "objects"
            - name: MARIADB_TABLE_BOOKS
              value: "books"
            - name: MARIADB_TABLE_REVIEWS
              value: "reviews"
      restartPolicy: OnFailure
{{- end }}

