{{ if .Values.config.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.frontend.name }}
  labels:
    app: {{ .Values.config.frontend.name }}
spec:
  replicas: {{ .Values.config.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.frontend.name }}
    spec:
      containers:
      - name: {{ .Values.config.frontend.name }}
        image: {{ .Values.config.frontend.image }}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.frontend.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.config.frontend.name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081   
{{ end }}
