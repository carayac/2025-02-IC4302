{{ if .Values.config.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.backend.name }}
  labels:
    app: {{ .Values.config.backend.name }}
spec:
  replicas: {{ .Values.config.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.backend.name }}
    spec:
      containers:
      - name: {{ .Values.config.backend.name }}
        image: {{ .Values.config.backend.image }}
        ports:
        - containerPort: 5000
        env:
            - name: PROMETHEUSENDPOINT
              value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
            - name: MARIADB
              value: "databases-mariadb"
            - name: MARIADB_TABLE
              value: "objects"
            - name: MARIADB_DB
              value: "control"
            - name: MARIADB_USER
              value: "root"
            - name: MARIADB_PASS
              valueFrom:
                secretKeyRef:
                  name: databases-mariadb
                  key: mariadb-root-password
                  optional: false
            - name: ELASTIC_USER
              value: "elastic"
            - name: ES_PORT
              value: "9200"
            - name: ELASTIC_PASS
              valueFrom:
                secretKeyRef:
                  name: ic4302-es-elastic-user
                  key: elastic
                  optional: false
            - name: ELASTIC
              value: "ic4302-es-http"
            - name: MEMCACHED_HOST
              value: "databases-memcached"
            - name: MEMCACHED_PORT
              value: "11211"
            - name: ingestEndpoint
              value: "http://data-ingestion:8080" #change for the real endpoint of data-ingestion service
            
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.backend.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.config.backend.name }}
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
{{ end }}
