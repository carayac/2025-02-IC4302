{{ if .Values.config.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.backend.name }}
  labels:
    app: {{ .Values.config.backend.name }}
spec:
  replicas: {{ .Values.config.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.backend.name }}
    spec:
      containers:
      - name: {{ .Values.config.backend.name }}
        image: {{ .Values.config.backend.image }}
        ports:
        - containerPort: 5000
        env:
            - name: PROMETHEUSENDPOINT
              value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
            - name: MARIADB
              value: "databases-mariadb"
            - name: MARIADB_TABLE
              value: "objects"
            - name: MARIADB_DB
              value: "promptsy"
            - name: MARIADB_USER
              value: "root"
            - name: MARIADB_PASS
              valueFrom:
                secretKeyRef:
                  name: databases-mariadb
                  key: mariadb-root-password
                  optional: false
            
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.backend.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.config.backend.name }}
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
{{ end }}
