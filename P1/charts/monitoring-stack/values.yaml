grafana:
  namespace: monitoring
  namespaceOverride: monitoring
  operator:
    enabled: true
    scanAllNamespaces: true
    prometheus:
      serviceMonitor:
        enabled: true
  grafana:
    enabled: true
    dashboardLabelSelectors:
      - matchLabels:
          app: grafana
    persistence:
      enabled: true
      size: 5Gi
prometheus:
  namespace: monitoring
  namespaceOverride: monitoring
  enabled: true
  prometheusServer:
    enabled: true
    replicas: 1
    retention: 2d
    persistence:
      enabled: true
      size: 5Gi
  alertmanager:
    enabled: true
    persistence:
      enabled: true
      size: 5Gi