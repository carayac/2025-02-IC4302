grafana:
  namespace: monitoring
  namespaceOverride: monitoring
  operator:
    enabled: true
    scanAllNamespaces: true
    prometheus:
      serviceMonitor:
        enabled: true
  grafana:
    enabled: true
    dashboardLabelSelectors:
      - matchLabels:
          app: grafana
    persistence:
      enabled: true
      size: 5Gi
prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: 'pushgateway'
        static_configs:
          - targets: ['pushgateway.monitoring.svc.cluster.local:9091']
  namespace: monitoring
  namespaceOverride: monitoring
  enabled: true
  prometheusServer:
    enabled: true
    replicas: 1
    retention: 2d
    persistence:
      enabled: true
      size: 5Gi
  alertmanager:
    enabled: true
    persistence:
      enabled: true
      size: 5Gi