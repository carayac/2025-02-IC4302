{{ if .Values.config.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.backend.name }}
  labels:
    app: {{ .Values.config.backend.name }}
spec:
  replicas: {{ .Values.config.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.config.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.config.backend.name }}
    spec:
      containers:
      - name: {{ .Values.config.backend.name }}
        image: {{ .Values.config.backend.image }}
        ports:
        - containerPort: 80
        env:
            - name: backendEndpoint
              value: "http://127:0:0:1:30080"
            
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.backend.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.config.backend.name }}
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30081
{{ end }}
