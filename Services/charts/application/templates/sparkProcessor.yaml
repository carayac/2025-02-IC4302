{{- if .Values.config.sparkProcessorJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.config.sparkProcessorJob.name }}
spec:
  schedule: "{{ .Values.config.sparkProcessorJob.schedule }}"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: {{ .Values.config.sparkProcessorJob.name }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: {{ .Values.config.sparkProcessorJob.name }}
              image: {{ .Values.config.docker_registry }}/{{ .Values.config.sparkProcessorJob.image }}
              env:
                - name: S3_BUCKET
                  value: "ic-tec-dataset"
                - name: S3_PREFIXES
                  value: "amazon-books,amazon-book-reviews"
                - name: AWS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret
                      key: AWS_ACCESS_KEY
                      optional: false
                - name: AWS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret
                      key: AWS_SECRET_KEY
                      optional: false
                - name: AWS_REGION
                  value: "us-east-1"
              volumeMounts:
                - name: augmented-data
                  mountPath: /app/data
          volumes:
            - name: augmented-data
              persistentVolumeClaim:
                claimName: augmented-pvc
{{- end }}
